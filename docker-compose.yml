services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-0000}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pfe_db}
      MYSQL_USER: ${MYSQL_USER:-pfe_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pfe_pass}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env.docker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-pfe_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-pfe_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-pfe_pass}
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      X_API_KEY: ${X_API_KEY:-change-this-in-production}
      ALLOWED_ORIGINS: http://${HOST_IP:-localhost}:3000
    ports:
      - "8080:8080"
    networks:
      - app-network

  frontend:
    build:
      context: ./cv-grading-system-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - app-network

volumes:
  db_data:

networks:
  app-network:
    driver: bridge
